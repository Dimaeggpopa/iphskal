name: Build iPhone iOS IPA (MyGarageIOS)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build Unsigned iOS .ipa on macOS
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project & Build IPA
        working-directory: ios
        run: |
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Upload MyGarageIOS.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyGarageIOS-iPhone-IPA
          path: ios/build/MyGarageIOS.ipa
