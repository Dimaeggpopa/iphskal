name: MyGarageIOS
options:
  bundleIdPrefix: com.aistudio.mygarage
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.4.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 8.0.0

targets:
  MyGarageIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MyGarageIOS
    info:
      path: MyGarageIOS/Info.plist
      properties:
        CFBundleDisplayName: "Мой гараж"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSCameraUsageDescription: "Камера используется для сканирования QR-кодов, штрихкодов и создания фото-подсказок полок в гараже."
        NSPhotoLibraryUsageDescription: "Фотогалерея используется для прикрепления фотографий товаров и фото-подсказок мест хранения."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.1067776833572-5d3qf8bjntdmt3ut091m5da1p6ef2554
    entitlements:
      path: MyGarageIOS/MyGarage.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.mygarage.cnydgl
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: MyGarageIOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: MyGarageIOS/MyGarage.entitlements
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
